<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아이들 레벨업 AI 일기장 🚀</title>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background-color: #f0f4f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { width: 950px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); display: flex; gap: 20px; }
        .left-panel { flex: 1; display: flex; flex-direction: column; }
        .right-panel { flex: 1; background: #fdfdfd; border-left: 2px solid #e2e8f0; padding-left: 20px; display: flex; flex-direction: column; position: relative; }
        h2 { color: #2b6cb0; margin-top: 0; }
        textarea { width: 100%; height: 320px; padding: 15px; border: 2px solid #cbd5e0; border-radius: 10px; font-size: 16px; resize: none; box-sizing: border-box; }
        textarea:focus { border-color: #4299e1; outline: none; }
        .stats { margin-top: 10px; font-size: 14px; color: #4a5568; font-weight: bold; }
        button { margin-top: 15px; background: #3182ce; color: white; border: none; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2b6cb0; }
        
        /* 피드백 박스 스타일 */
        .feedback-box { flex: 1; border: 1px solid #e2e8f0; border-radius: 10px; padding: 15px; background: #f7fafc; white-space: pre-wrap; overflow-y: auto; font-size: 15px; line-height: 1.6; color: #2d3748; }
        .loading { display: none; color: #3182ce; font-weight: bold; text-align: center; margin-top: 20px; }
        
        /* 📈 업그레이드: 점수판 스타일 */
        .score-container { display: none; margin-bottom: 15px; background: #ebf8ff; padding: 12px; border-radius: 10px; border: 1px solid #bee3f8; }
        .score-bar-wrapper { margin: 8px 0; }
        .score-label { font-size: 14px; color: #2b6cb0; font-weight: bold; display: flex; justify-content: space-between; }
        .score-bar { background: #e2e8f0; height: 12px; border-radius: 6px; overflow: hidden; margin-top: 4px; }
        .score-fill { background: #4299e1; height: 100%; width: 0%; transition: width 1s ease-in-out; }
        
        /* 💮 업그레이드: 칭찬 도장 스타일 */
        .stamp-badge { 
            display: none; position: absolute; top: 10px; right: 20px; 
            width: 90px; height: 90px; border-radius: 50%; 
            border: 4px dashed #e53e3e; color: #e53e3e;
            text-align: center; line-height: 20px; font-weight: bold; font-size: 14px;
            transform: rotate(15deg); justify-content: center; align-items: center;
            flex-direction: column; background-color: rgba(255,255,255,0.8);
            box-shadow: 0 0 8px rgba(229, 62, 62, 0.2);
            animation: stamp-animation 0.4s ease-in-out;
        }
        @keyframes stamp-animation {
            0% { transform: scale(3) rotate(45deg); opacity: 0; }
            100% { transform: scale(1) rotate(15deg); opacity: 1; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 왼쪽: 아이가 글을 쓰는 공간 -->
    <div class="left-panel">
        <h2>✍️ 오늘의 일기 쓰기</h2>
        <p style="color:#718096; margin-top:-10px; font-size:14px;">오늘 하루 있었던 일을 멋지게 적고 레벨업에 도전해봐요!</p>
        <textarea id="diaryInput" placeholder="오늘 학교에서 무슨 일이 있었나요? 내 기분은 어땠나요? 차근차근 적어보세요..."></textarea>
        <div class="stats">⏱️ 실시간 글자 수: <span id="charCount">0</span>자</div>
        <button onclick="submitDiary()">🤖 AI 선생님께 검사받기</button>
        <div id="loadingText" class="loading">⏳ AI 선생님이 채점과 피드백을 준비하고 있어요...</div>
    </div>

    <!-- 오른쪽: AI 선생님의 첨삭 피드백 공간 -->
    <div class="right-panel">
        <h2>👩‍🏫 마법 힌트 & 레벨업</h2>
        
        <!-- 💮 칭찬 도장 위치 -->
        <div id="stampBadge" class="stamp-badge"><div>💮</div><div id="stampText">참 잘했어요</div></div>

        <!-- 📈 점수 시각화 구역 -->
        <div id="scoreContainer" class="score-container">
            <div class="score-bar-wrapper">
                <div class="score-label"><span>✨ 맞춤법 점수</span><span id="spellingScoreText">0점</span></div>
                <div class="score-bar"><div id="spellingScoreFill" class="score-fill"></div></div>
            </div>
            <div class="score-bar-wrapper">
                <div class="score-label"><span>💡 표현력 점수</span><span id="expressionScoreText">0점</span></div>
                <div class="score-bar"><div id="expressionScoreFill" class="score-fill"></div></div>
            </div>
        </div>

        <div id="feedbackResult" class="feedback-box">일기를 작성하고 왼쪽 아래 '검사받기' 버튼을 누르면, 다정한 선생님의 피드백과 어휘 레벨업 힌트가 여기에 등장해요!</div>
    </div>
</div>

<script>
    const textarea = document.getElementById('diaryInput');
    const charCount = document.getElementById('charCount');
    
    textarea.addEventListener('input', () => {
        charCount.innerText = textarea.value.length;
    });

    async function submitDiary() {
        const content = textarea.value.trim();
        if (!content) {
            alert('일기 내용을 입력해주세요!');
            return;
        }

        const loadingText = document.getElementById('loadingText');
        const feedbackResult = document.getElementById('feedbackResult');
        const scoreContainer = document.getElementById('scoreContainer');
        const stampBadge = document.getElementById('stampBadge');
        
        // 초기화
        loadingText.style.display = 'block';
        feedbackResult.innerText = 'AI 선생님이 일기를 분석하고 있습니다...';
        scoreContainer.style.display = 'none';
        stampBadge.style.display = 'none';

        try {
            const response = await fetch('https://ai-diary-cheomsak.onrender.com/check-diary', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ content: content })
            });

            const rawData = await response.text();
            
            try {
                const data = JSON.parse(rawData);
                if (response.ok) {
                    // 1. 피드백 텍스트 반영
                    feedbackResult.innerText = data.feedback;
                    
                    // 2. 점수판 보이기 및 애니메이션 설정
                    scoreContainer.style.display = 'block';
                    document.getElementById('spellingScoreText').innerText = data.spelling_score + '점';
                    document.getElementById('expressionScoreText').innerText = data.expression_score + '점';
                    
                    // 게이지 바 채우기 애니메이션 (약간의 시차를 두어 부드럽게 강조)
                    setTimeout(() => {
                        document.getElementById('spellingScoreFill').style.width = data.spelling_score + '%';
                        document.getElementById('expressionScoreFill').style.width = data.expression_score + '%';
                    }, 100);

                    # 3. 도장 찍기 애니메이션 설정
                    document.getElementById('stampText').innerText = data.stamp;
                    // 도장 종류에 따른 색상 변화 추가
                    if(data.stamp === '참 잘했어요') stampBadge.style.color = stampBadge.style.borderColor = '#e53e3e';
                    else if(data.stamp === '좋은 시도예요') stampBadge.style.color = stampBadge.style.borderColor = '#dd6b20';
                    else stampBadge.style.color = stampBadge.style.borderColor = '#3182ce';
                    
                    stampBadge.style.display = 'flex';

                } else {
                    feedbackResult.innerText = '오류 발생: ' + (data.detail || JSON.stringify(data));
                }
            } catch (jsonError) {
                feedbackResult.innerText = '서버 응답 오류가 발생했습니다.\n형식: ' + rawData;
            }

        } catch (error) {
            feedbackResult.innerText = '인터넷 연결 오류가 발생했습니다: ' + error.message;
        } finally {
            loadingText.style.display = 'none';
        }
    }
</script>

</body>
</html>
